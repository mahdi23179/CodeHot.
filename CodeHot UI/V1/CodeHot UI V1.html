<!DOCTYPE html>
<!-- CodeHot UI V15 | single-file UI designer for the CodeHot game engine.
     Two tabs: Chat (AI UI builder) + Design (manual canvas editor).
     All state persists under localStorage keys prefixed with `codehot-ui-`.
     Visual identity matches CodeHot V14 exactly (colors, fonts, tab bar, header). -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CodeHot UI V15</title>
  <style>
    /* ============================================================
       Design tokens — copied verbatim from CodeHot V14
       ============================================================ */
    :root {
      --st-bg-primary: #0f0f0f;
      --st-bg-panel: #161b22;
      --st-bg-input: #0f0f0f;
      --st-border: #2a2a2a;
      --st-text-primary: #e0e0e0;
      --st-text-secondary: #888888;
      --st-accent: #ff6b35;
      --st-accent-text: #ffffff;
      --st-hover-bg: rgba(255, 255, 255, 0.05);
      --st-danger: #ff4a4a;
      --st-success: #4caf50;
      --st-shadow: rgba(0, 0, 0, 0.4);
    }
    [data-theme="light"] {
      --st-bg-primary: #f5f5f5;
      --st-bg-panel: #ffffff;
      --st-bg-input: #f0f0f0;
      --st-border: #e0e0e0;
      --st-text-primary: #1a1a1a;
      --st-text-secondary: #666666;
      --st-accent: #ff6b35;
      --st-accent-text: #ffffff;
      --st-hover-bg: rgba(0, 0, 0, 0.04);
      --st-danger: #d92c2c;
      --st-success: #4caf50;
      --st-shadow: rgba(0, 0, 0, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Roboto, sans-serif;
      font-size: 14px;
      background: var(--st-bg-primary);
      color: var(--st-text-primary);
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================================================
       App shell — header, panels, bottom tab bar (matches V14)
       ============================================================ */
    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
    }

    .tab-panel {
      display: none; flex: 1; min-height: 0;
      flex-direction: column;
      background: var(--st-bg-primary);
    }
    .tab-panel.active { display: flex; }

    /* Header — matches #st-header in V14 */
    .app-header {
      height: 44px;
      background: var(--st-bg-panel);
      border-bottom: 1px solid var(--st-border);
      display: flex; align-items: center;
      padding: 0 14px; gap: 8px;
      flex-shrink: 0;
    }
    .app-header .header-title {
      font-size: 14px; font-weight: 700;
      color: var(--st-text-primary);
      flex: 1;
    }
    .header-icon-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--st-text-secondary);
      cursor: pointer; border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .header-icon-btn:hover { background: var(--st-hover-bg); color: var(--st-text-primary); }
    .header-icon-btn svg { width: 20px; height: 20px; }

    /* Bottom tab bar — matches #bottomTabBar in V14 */
    #bottomTabBar {
      flex-shrink: 0;
      display: flex; direction: ltr;
      background: var(--st-bg-panel);
      border-top: 1px solid var(--st-border);
      min-height: 52px;
    }
    #bottomTabBar.sh-rtl { flex-direction: row-reverse; }
    .sh-tab-btn {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; min-height: 44px; padding: 6px 2px;
      background: none; border: none; cursor: pointer;
      color: var(--st-text-secondary);
      transition: color 0.2s ease;
    }
    .sh-tab-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .sh-tab-label {
      font-size: 11px; font-weight: 600;
      color: inherit;
    }
    .sh-tab-btn.sh-active { color: var(--st-accent); }

    /* ============================================================
       Shared building blocks (match V14 .st-* styles)
       ============================================================ */
    .st-text-input, select.st-text-input, textarea.st-text-input {
      width: 100%; padding: 10px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 5px;
      font-size: 12px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    .st-text-input:focus { border-color: var(--st-accent); }
    textarea.st-text-input { resize: vertical; min-height: 80px; line-height: 1.5; }

    .st-settings-button {
      padding: 11px 14px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 5px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: background 0.2s;
      min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .st-settings-button:hover { background: var(--st-hover-bg); }
    .st-settings-button.st-primary {
      background: var(--st-accent); border-color: var(--st-accent);
      color: var(--st-accent-text);
    }
    .st-settings-button.st-danger {
      color: var(--st-danger); border-color: var(--st-danger);
    }
    .st-settings-button:disabled { opacity: 0.45; cursor: not-allowed; }
    .st-settings-button svg { width: 16px; height: 16px; }

    .st-section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 15px 14px; cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 600;
      transition: background 0.15s; min-height: 44px;
    }
    .st-section-header:hover { background: var(--st-hover-bg); }
    .st-section-chevron {
      display: flex; align-items: center;
      transition: transform 0.2s;
      color: var(--st-text-secondary); flex-shrink: 0;
      margin-inline-start: auto;
    }
    .st-section-header.st-collapsed .st-section-chevron { transform: rotate(-90deg); }
    .st-section-body {
      padding: 2px 14px 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .st-section-body.st-collapsed { display: none; }
    .st-settings-section {
      border-bottom: 1px solid var(--st-border);
    }
    .st-setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; min-height: 30px;
    }
    .st-setting-row.st-stacked { flex-direction: column; align-items: stretch; gap: 6px; }
    .st-setting-label { font-size: 12px; color: var(--st-text-primary); }
    .st-setting-hint { font-size: 10px; color: var(--st-text-secondary); line-height: 1.4; }

    /* Modal — matches .st-modal-overlay in V14 */
    .st-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none; z-index: 300;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .st-modal-overlay.st-visible { display: flex; }
    .st-settings-modal {
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      border-radius: 8px; padding: 16px;
      max-width: 360px; width: 100%;
      display: flex; flex-direction: column; gap: 14px;
      max-height: 80vh; overflow-y: auto;
    }
    .st-settings-modal-title { font-size: 14px; font-weight: 600; color: var(--st-text-primary); }
    .st-settings-modal-message { font-size: 12px; color: var(--st-text-primary); line-height: 1.5; }
    .st-settings-modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      padding: 10px 16px; border-radius: 6px;
      font-size: 12px; font-weight: 600;
      z-index: 400; opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      box-shadow: 0 4px 12px var(--st-shadow);
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--st-success); }
    .toast.error { border-color: var(--st-danger); }

    /* ============================================================
       Tab 1: Chat
       ============================================================ */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 30px;
      color: var(--st-text-secondary); text-align: center;
    }
    .chat-empty svg { width: 56px; height: 56px; opacity: 0.5; }
    .chat-empty .empty-title { font-size: 14px; font-weight: 600; color: var(--st-text-primary); }
    .chat-empty .empty-hint { font-size: 12px; line-height: 1.6; max-width: 280px; }

    .chat-bubble {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px; line-height: 1.6;
      word-wrap: break-word; word-break: break-word;
      white-space: pre-wrap;
      animation: bubbleIn 0.18s ease-out;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: rgba(255, 107, 53, 0.15);
      border: 1px solid rgba(255, 107, 53, 0.4);
      color: var(--st-text-primary);
      border-bottom-right-radius: 3px;
    }
    .chat-bubble.assistant {
      align-self: flex-start;
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-bottom-left-radius: 3px;
    }
    .chat-bubble.system {
      align-self: center;
      background: transparent;
      border: 1px dashed var(--st-border);
      color: var(--st-text-secondary);
      font-size: 11px; max-width: 90%; text-align: center;
    }
    .chat-bubble.system.error { border-color: var(--st-danger); color: var(--st-danger); }
    .chat-bubble.system.success { border-color: var(--st-success); color: var(--st-success); }

    /* Code card inside assistant message */
    .code-card {
      margin-top: 10px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .code-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--st-border);
      background: var(--st-bg-panel);
    }
    .code-card-title {
      font-size: 11px; font-weight: 600;
      color: var(--st-text-secondary);
      display: flex; align-items: center; gap: 6px;
    }
    .code-card-title svg { width: 14px; height: 14px; }
    .code-card-actions { display: flex; gap: 6px; }
    .code-card-btn {
      padding: 5px 10px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 4px;
      font-size: 11px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .code-card-btn:hover { background: var(--st-hover-bg); }
    .code-card-btn.primary {
      background: var(--st-accent); border-color: var(--st-accent);
      color: var(--st-accent-text);
    }
    .code-card-btn svg { width: 12px; height: 12px; }
    .code-card pre {
      max-height: 320px; overflow: auto;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 11px; line-height: 1.5;
      color: var(--st-text-primary);
      white-space: pre;
      direction: ltr; text-align: left;
    }
    .code-card pre.collapsed { display: none; }

    /* Typing indicator */
    .typing-indicator {
      align-self: flex-start;
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      border-radius: 10px;
      border-bottom-left-radius: 3px;
      padding: 12px 14px;
      display: none; gap: 4px;
    }
    .typing-indicator.visible { display: inline-flex; }
    .typing-indicator span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--st-text-secondary);
      animation: typingDot 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }

    /* Chat input bar (fixed above the bottom tab bar) */
    .chat-input-bar {
      flex-shrink: 0;
      background: var(--st-bg-panel);
      border-top: 1px solid var(--st-border);
      padding: 8px 10px;
      display: flex; align-items: flex-end; gap: 8px;
      position: relative;
    }
    .chat-textarea {
      flex: 1;
      min-height: 40px; max-height: 120px;
      padding: 10px 12px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 8px;
      font-size: 13px; font-family: inherit;
      line-height: 1.4; resize: none;
      outline: none; transition: border-color 0.15s;
    }
    .chat-textarea:focus { border-color: var(--st-accent); }
    .chat-textarea::placeholder { color: var(--st-text-secondary); }

    .chat-action-btn {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-secondary);
      border-radius: 8px; cursor: pointer;
      flex-shrink: 0; transition: background 0.15s, color 0.15s;
    }
    .chat-action-btn:hover { background: var(--st-hover-bg); color: var(--st-text-primary); }
    .chat-action-btn svg { width: 18px; height: 18px; }
    .chat-action-btn.active { color: var(--st-accent); border-color: var(--st-accent); }
    .chat-send-btn {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--st-accent); border: none;
      color: var(--st-accent-text);
      border-radius: 8px; cursor: pointer;
      flex-shrink: 0; transition: opacity 0.15s;
    }
    .chat-send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .chat-send-btn svg { width: 18px; height: 18px; transform: rotate(180deg); }

    /* + button popover menu */
    .plus-menu {
      position: absolute;
      bottom: 54px; inset-inline-end: 10px;
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      border-radius: 8px;
      box-shadow: 0 4px 16px var(--st-shadow);
      min-width: 180px;
      overflow: hidden;
      display: none;
      z-index: 50;
    }
    .plus-menu.visible { display: block; }
    .plus-menu-item {
      width: 100%;
      padding: 12px 14px;
      background: none; border: none;
      color: var(--st-text-primary);
      font-size: 12px; font-weight: 600;
      text-align: start; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--st-border);
      transition: background 0.15s;
    }
    .plus-menu-item:last-child { border-bottom: none; }
    .plus-menu-item:hover { background: var(--st-hover-bg); }
    .plus-menu-item svg { width: 16px; height: 16px; color: var(--st-accent); }
    .plus-menu-divider {
      padding: 4px 14px;
      font-size: 10px; font-weight: 700;
      color: var(--st-text-secondary);
      background: var(--st-bg-input);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ============================================================
       Tab 2: Design
       ============================================================ */
    .design-toolbar {
      flex-shrink: 0;
      background: var(--st-bg-panel);
      border-bottom: 1px solid var(--st-border);
      padding: 8px 10px;
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; white-space: nowrap;
    }
    .design-toolbar .toolbar-spacer { flex: 1; }

    .design-canvas-wrap {
      flex: 1; overflow: auto;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 20px; gap: 14px;
      background:
        repeating-linear-gradient(45deg,
          transparent, transparent 10px,
          rgba(255,255,255,0.015) 10px, rgba(255,255,255,0.015) 20px);
    }

    /* Palette */
    .design-palette {
      flex-shrink: 0;
      width: 130px;
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      border-radius: 8px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
      align-self: flex-start;
    }
    .palette-title {
      font-size: 10px; font-weight: 700;
      color: var(--st-text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--st-border);
    }
    .palette-item {
      width: 100%;
      padding: 10px 8px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      border-radius: 5px;
      color: var(--st-text-primary);
      font-size: 11px; font-weight: 600;
      cursor: grab; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: border-color 0.15s, background 0.15s;
    }
    .palette-item:hover { border-color: var(--st-accent); background: var(--st-hover-bg); }
    .palette-item:active { cursor: grabbing; }
    .palette-item svg { width: 22px; height: 22px; color: var(--st-accent); }

    /* Phone-frame preview */
    .phone-frame {
      position: relative;
      width: 375px;
      height: 667px;
      background: #000;
      border-radius: 36px;
      border: 8px solid #1a1a1a;
      box-shadow: 0 12px 40px var(--st-shadow), inset 0 0 0 1px #333;
      flex-shrink: 0;
      overflow: hidden;
    }
    .phone-frame .phone-notch {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 120px; height: 22px;
      background: #1a1a1a;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 20;
    }
    .phone-screen {
      position: absolute; inset: 0;
      overflow: hidden;
      background: var(--st-bg-input);
    }
    .phone-screen iframe {
      width: 100%; height: 100%;
      border: none; display: block;
      pointer-events: none;
    }
    .phone-screen .empty-screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      color: var(--st-text-secondary);
      font-size: 11px; text-align: center;
      padding: 20px;
    }
    .empty-screen svg { width: 40px; height: 40px; opacity: 0.4; }

    /* Draggable UI elements inside the phone preview */
    .ui-element {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      cursor: move; user-select: none;
      transition: outline 0.1s;
      outline: 2px solid transparent;
      outline-offset: 2px;
      z-index: 5;
    }
    .ui-element.selected { outline-color: var(--st-accent); }
    .ui-element.joystick {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(255, 107, 53, 0.25);
      border: 2px solid var(--st-accent);
    }
    .ui-element.joystick::after {
      content: '';
      position: absolute;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--st-accent);
      opacity: 0.8;
    }
    .ui-element.button {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255, 107, 53, 0.5);
      border: 2px solid var(--st-accent);
      color: var(--st-accent-text);
      font-size: 11px; font-weight: 700;
    }
    .ui-element.image {
      width: 80px; height: 80px;
      background: var(--st-bg-panel);
      border: 2px solid var(--st-border);
      background-size: cover; background-position: center;
    }
    .ui-element.text {
      min-width: 60px; min-height: 24px;
      padding: 4px 8px;
      background: transparent;
      color: var(--st-text-primary);
      font-size: 13px; font-weight: 600;
    }
    .ui-element .ui-handle {
      position: absolute;
      bottom: -6px; right: -6px;
      width: 14px; height: 14px;
      background: var(--st-accent);
      border: 2px solid var(--st-bg-primary);
      border-radius: 50%;
      display: none;
      cursor: nwse-resize;
    }
    .ui-element.selected .ui-handle { display: block; }
    .ui-element .ui-name-tag {
      position: absolute;
      top: -22px; left: 0;
      background: var(--st-accent);
      color: var(--st-accent-text);
      font-size: 9px; font-weight: 700;
      padding: 2px 6px; border-radius: 3px;
      white-space: nowrap; display: none;
    }
    .ui-element.selected .ui-name-tag { display: block; }

    /* Properties panel */
    .design-properties {
      flex-shrink: 0;
      width: 240px;
      background: var(--st-bg-panel);
      border: 1px solid var(--st-border);
      border-radius: 8px;
      padding: 10px;
      align-self: flex-start;
      max-height: 667px;
      overflow-y: auto;
    }
    .properties-title {
      font-size: 10px; font-weight: 700;
      color: var(--st-text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--st-border);
      margin-bottom: 10px;
    }
    .prop-empty {
      padding: 20px 10px;
      color: var(--st-text-secondary);
      font-size: 11px; text-align: center; line-height: 1.5;
    }
    .prop-row {
      display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 10px;
    }
    .prop-label {
      font-size: 10px; font-weight: 600;
      color: var(--st-text-secondary);
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .prop-row-two {
      display: flex; gap: 6px;
    }
    .prop-row-two > div { flex: 1; }
    .prop-row input, .prop-row select {
      padding: 8px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 4px;
      font-size: 11px; font-family: inherit;
      outline: none;
    }
    .prop-row input:focus, .prop-row select:focus { border-color: var(--st-accent); }
    .prop-color-row {
      display: flex; align-items: center; gap: 6px;
    }
    .prop-color-row input[type="color"] {
      width: 36px; height: 32px; padding: 2px;
      border: 1px solid var(--st-border);
      border-radius: 4px; background: var(--st-bg-input); cursor: pointer;
    }
    .prop-color-row input[type="text"] { flex: 1; }
    .prop-actions { display: flex; gap: 6px; margin-top: 6px; }
    .prop-actions button { flex: 1; }

    /* Inline prompt editor (shown when user adds prompt via + menu) */
    .prompt-editor {
      display: none;
      padding: 10px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-accent);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .prompt-editor.visible { display: block; }
    .prompt-editor .prompt-editor-label {
      font-size: 10px; font-weight: 700;
      color: var(--st-accent);
      margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .prompt-editor textarea {
      width: 100%; min-height: 60px;
      background: var(--st-bg-primary);
      border: 1px solid var(--st-border);
      color: var(--st-text-primary);
      border-radius: 4px;
      padding: 8px; font-size: 11px;
      font-family: inherit; resize: vertical; outline: none;
    }
    .prompt-editor textarea:focus { border-color: var(--st-accent); }

    /* Asset list (after images are added) */
    .asset-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      background: var(--st-bg-input);
      border: 1px solid var(--st-border);
      border-radius: 12px;
      font-size: 10px; color: var(--st-text-secondary);
      margin: 2px;
    }
    .asset-chip svg { width: 10px; height: 10px; color: var(--st-accent); }
    .asset-chip .chip-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ============================================================
       Settings modal (gear icon in header)
       ============================================================ */
    .settings-sheet {
      position: fixed;
      inset: 0; z-index: 350;
      display: none;
      align-items: stretch; justify-content: stretch;
    }
    .settings-sheet.visible { display: flex; }
    .settings-sheet-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
    }
    .settings-sheet-panel {
      position: absolute;
      inset-inline-end: 0; top: 0; bottom: 0;
      width: 320px; max-width: 100%;
      background: var(--st-bg-primary);
      border-inline-start: 1px solid var(--st-border);
      display: flex; flex-direction: column;
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    [dir="rtl"] @keyframes slideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .settings-sheet-panel .sheet-header {
      height: 44px;
      background: var(--st-bg-panel);
      border-bottom: 1px solid var(--st-border);
      display: flex; align-items: center;
      padding: 0 14px; gap: 10px;
      flex-shrink: 0;
    }
    .settings-sheet-panel .sheet-header .sheet-title {
      flex: 1; font-size: 14px; font-weight: 700;
      color: var(--st-text-primary);
    }
    .settings-sheet-panel .sheet-body {
      flex: 1; overflow-y: auto;
    }
    .st-segmented {
      display: flex;
      border: 1px solid var(--st-border);
      border-radius: 6px; overflow: hidden;
      flex-shrink: 0;
    }
    .st-segmented button {
      flex: 1;
      padding: 8px 14px;
      background: var(--st-bg-input);
      border: none;
      color: var(--st-text-secondary);
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      min-height: 36px;
    }
    .st-segmented button.st-active {
      background: var(--st-accent);
      color: var(--st-accent-text);
    }

    /* Hidden file inputs */
    .hidden-input { display: none; }

    /* Responsive: stack palette/properties under canvas on small screens */
    @media (max-width: 900px) {
      .design-canvas-wrap { flex-direction: column; align-items: center; }

    .tok-com { color: #6a6a6a; font-style: italic; }

      joystick: 'Joystick', button: 'Button', text: 'Text', palette: 'Palette',
      properties: 'Properties', selectElement: 'Select an element',

  // ── State ────────────────────────────────────────────────────
  const State = {
    settings: { theme: 'dark', language: 'fa' },
    project: null,           // { raw: htmlString, config: parsedConfig, objects, scripts, moMarkers }
    canvas: [],              // UI elements on the design canvas
    assets: [],              // [{ name, dataUrl }] uploaded images
    conversation: [],        // [{ role, content }]
    isSending: false,
    selectedElementId: null,
    extraPrompt: ''

  // V1.1: TBJS source is inlined here so the exported HTML is fully
  // standalone — no external tbjs.js file needed. This is the complete
  // TBJS runtime with joystick, button, axis binding + keyboard fallback.
  const TBJS_SOURCE = `/*
 * TBJS — CodeHot UI Button Binding Runtime
 * Version: 15.0.0
 *
 * Connects UI overlay elements (joysticks, buttons) to the "mo" markers
 * that CodeHot game scripts reference. When a CodeHot script does:
 *
 *   update(ctx, self) {
 *     self.position.x = mo.joystick.x * 5;
 *     if (mo.jump) self.position.y += 0.3;
 *   }
 *
 * TBJS provides the live \`mo\` object whose values update from the UI
 * elements placed by CodeHot UI's design tab.
 *
 * UI elements are expected to have data attributes:
 *   data-tbjs-type   = "joystick" | "button" | "axis"
 *   data-tbjs-name   = "joystick" | "jump" | "action" | custom
 *   data-tbjs-axis   = "x" | "y" (for joysticks/axes)
 *
 * TBJS auto-discovers these on DOMContentLoaded and starts polling.
 * The \`mo\` object is exposed on \`window.mo\` so game scripts can read it.
 *
 * Also exposes:
 *   window.TBJS.bindElement(el, config)
 *   window.TBJS.unbindElement(el)
 *   window.TBJS.getState()    — snapshot of all mo values
 *   window.TBJS.reset()       — zeroes everything
 *   window.TBJS.onPress(name, cb)     — callback fires when button name goes true
 *   window.TBJS.onRelease(name, cb)   — callback fires when button name goes false
 */
(function (global) {
  'use strict';

  if (global.TBJS && global.mo) return; // idempotent

  // ── mo state ──────────────────────────────────────────────────────
  // The mo object holds the live values game scripts read. Joysticks
  // expose \`.x\` and \`.y\` (clamped -1..1). Buttons expose a boolean
  // (true while pressed). Axes (one-dimensional sliders) expose a single
  // number.
  var state = {};
  var pressCallbacks = {};
  var releaseCallbacks = {};
  var boundElements = [];

  function ensurePath(name) {
    if (!state[name]) {
      if (name === 'joystick' || name === 'camera') {
        state[name] = { x: 0, y: 0, active: false };
      } else {
        state[name] = false;
      }
    }
  }

  function setValue(name, value) {
    ensurePath(name);
    var prev = JSON.parse(JSON.stringify(state[name]));
    if (typeof state[name] === 'object' && state[name] !== null && typeof value === 'object') {
      // merge {x, y} into joystick-like
      if (typeof value.x === 'number') state[name].x = clamp(value.x, -1, 1);
      if (typeof value.y === 'number') state[name].y = clamp(value.y, -1, 1);
      if (typeof value.active === 'boolean') state[name].active = value.active;
    } else {
      var newVal = !!value;
      state[name] = newVal;
      // fire callbacks on transition
      if (newVal && !prev) {
        (pressCallbacks[name] || []).forEach(function (cb) { try { cb(); } catch (e) {} });
      } else if (!newVal && prev) {
        (releaseCallbacks[name] || []).forEach(function (cb) { try { cb(); } catch (e) {} });
      }
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ── Joystick binding ──────────────────────────────────────────────
  // A joystick element is a circular div. Touch/mouse drag inside it
  // moves a "stick" child and updates mo.joystick.x/y proportionally.
  // Releasing the pointer snaps back to center.
  function bindJoystick(el, name) {
    var stick = el.querySelector('.tbjs-stick') || el;
    var rect = el.getBoundingClientRect();
    var radius = Math.min(rect.width, rect.height) / 2;
    var pointerId = null;
    var center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

    function refreshRect() {
      rect = el.getBoundingClientRect();
      radius = Math.min(rect.width, rect.height) / 2;
      center.x = rect.left + rect.width / 2;
      center.y = rect.top + rect.height / 2;
    }

    function onDown(e) {
      e.preventDefault();
      refreshRect();
      pointerId = (e.pointerId !== undefined) ? e.pointerId : 'mouse';
      if (e.setPointerCapture && e.pointerId !== undefined) {
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
      onMove(e);
    }

    function onMove(e) {
      if (pointerId === null) return;
      if (e.pointerId !== undefined && e.pointerId !== pointerId) return;
      var x = (e.clientX - center.x) / radius;
      var y = (e.clientY - center.y) / radius;
      // clamp to unit circle
      var mag = Math.sqrt(x * x + y * y);
      if (mag > 1) { x /= mag; y /= mag; }
      setValue(name, { x: x, y: y, active: true });
      if (stick && stick !== el) {
        stick.style.transform = 'translate(' + (x * radius) + 'px,' + (y * radius) + 'px)';
      }
    }

    function onUp(e) {
      if (pointerId === null) return;
      if (e.pointerId !== undefined && e.pointerId !== pointerId) return;
      pointerId = null;
      setValue(name, { x: 0, y: 0, active: false });
      if (stick && stick !== el) {
        stick.style.transform = 'translate(0,0)';
      }
    }

    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('pointerleave', onUp);

    return {
      el: el,
      type: 'joystick',
      name: name,
      destroy: function () {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.removeEventListener('pointerleave', onUp);
      }
    };
  }

  // ── Button binding ────────────────────────────────────────────────
  // A button element toggles mo.<name> between false (released) and
  // true (pressed). Works with both touch and mouse.
  function bindButton(el, name) {
    function onDown(e) {
      e.preventDefault();
      setValue(name, true);
      el.classList.add('tbjs-active');
    }
    function onUp(e) {
      setValue(name, false);
      el.classList.remove('tbjs-active');
    }
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('pointerleave', onUp);
    return {
      el: el,
      type: 'button',
      name: name,
      destroy: function () {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.removeEventListener('pointerleave', onUp);
      }
    };
  }

  // ── Axis binding (slider) ─────────────────────────────────────────
  // An axis element is a horizontal/vertical bar; dragging sets a
  // single number in [-1, 1]. Useful for throttle sliders.
  function bindAxis(el, name, axis) {
    axis = axis || 'x';
    var rect = el.getBoundingClientRect();
    var pointerId = null;

    function refreshRect() { rect = el.getBoundingClientRect(); }

    function onDown(e) {
      e.preventDefault();
      refreshRect();
      pointerId = (e.pointerId !== undefined) ? e.pointerId : 'mouse';
      if (e.setPointerCapture && e.pointerId !== undefined) {
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
      onMove(e);
    }

    function onMove(e) {
      if (pointerId === null) return;
      if (e.pointerId !== undefined && e.pointerId !== pointerId) return;
      var v;
      if (axis === 'y') {
        v = ((e.clientY - rect.top) / rect.height) * 2 - 1;
      } else {
        v = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      }
      v = clamp(v, -1, 1);
      ensurePath(name);
      if (typeof state[name] === 'object' && state[name] !== null) {
        state[name][axis] = v;
        state[name].active = true;
      } else {
        state[name] = v;
      }
    }

    function onUp(e) {
      if (pointerId === null) return;
      pointerId = null;
      if (typeof state[name] === 'object' && state[name] !== null) {
        state[name].active = false;
      }
    }

    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    return {
      el: el,
      type: 'axis',
      name: name,
      destroy: function () {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
      }
    };
  }

  // ── Public API ────────────────────────────────────────────────────
  function bindElement(el, config) {
    config = config || {};
    var type = config.type || el.getAttribute('data-tbjs-type') || 'button';
    var name = config.name || el.getAttribute('data-tbjs-name') || 'action';
    var axis = config.axis || el.getAttribute('data-tbjs-axis') || 'x';
    ensurePath(name);
    var binding;
    if (type === 'joystick') binding = bindJoystick(el, name);
    else if (type === 'axis') binding = bindAxis(el, name, axis);
    else binding = bindButton(el, name);
    boundElements.push(binding);
    return binding;
  }

  function unbindElement(el) {
    boundElements = boundElements.filter(function (b) {
      if (b.el === el) { b.destroy(); return false; }
      return true;
    });
  }

  function autoDiscover() {
    var els = document.querySelectorAll('[data-tbjs-type]');
    els.forEach(function (el) { bindElement(el); });
  }

  function getState() { return JSON.parse(JSON.stringify(state)); }

  function reset() {
    Object.keys(state).forEach(function (k) {
      if (typeof state[k] === 'object' && state[k] !== null) {
        state[k] = { x: 0, y: 0, active: false };
      } else {
        state[k] = false;
      }
    });
  }

  function onPress(name, cb) {
    if (!pressCallbacks[name]) pressCallbacks[name] = [];
    pressCallbacks[name].push(cb);
  }

  function onRelease(name, cb) {
    if (!releaseCallbacks[name]) releaseCallbacks[name] = [];
    releaseCallbacks[name].push(cb);
  }

  // Keyboard fallback: map WASD/arrows to mo.joystick, Space to mo.jump.
  // This lets the exported game be playable on desktop without touch UI.
  var keyboardKeys = {};
  function bindKeyboard() {
    document.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      keyboardKeys[e.code] = true;
      updateKeyboardJoystick();
      // Space → jump
      if (e.code === 'Space') setValue('jump', true);
      // Common action keys
      if (e.code === 'KeyE' || e.code === 'Enter') setValue('action', true);
      if (e.code === 'KeyF' || e.code === 'ShiftLeft') setValue('fire', true);
    });
    document.addEventListener('keyup', function (e) {
      keyboardKeys[e.code] = false;
      updateKeyboardJoystick();
      if (e.code === 'Space') setValue('jump', false);
      if (e.code === 'KeyE' || e.code === 'Enter') setValue('action', false);
      if (e.code === 'KeyF' || e.code === 'ShiftLeft') setValue('fire', false);
    });
  }

  function updateKeyboardJoystick() {
    var x = 0, y = 0;
    if (keyboardKeys['ArrowLeft'] || keyboardKeys['KeyA']) x -= 1;
    if (keyboardKeys['ArrowRight'] || keyboardKeys['KeyD']) x += 1;
    if (keyboardKeys['ArrowUp'] || keyboardKeys['KeyW']) y -= 1;
    if (keyboardKeys['ArrowDown'] || keyboardKeys['KeyS']) y += 1;
    ensurePath('joystick');
    var active = (x !== 0 || y !== 0);
    setValue('joystick', { x: x, y: y, active: active });
  }

  // ── Bootstrap ─────────────────────────────────────────────────────
  global.mo = state;
  global.TBJS = {
    version: '15.0.0',
    bindElement: bindElement,
    unbindElement: unbindElement,
    autoDiscover: autoDiscover,
    getState: getState,
    reset: reset,
    onPress: onPress,
    onRelease: onRelease,
    state: state
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      autoDiscover();
      bindKeyboard();
    });
  } else {
    autoDiscover();
    bindKeyboard();
  }
})(typeof window !== 'undefined' ? window : this);
`;

  // ── Persistence ──────────────────────────────────────────────
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(State.settings));
      localStorage.setItem(STORAGE_KEYS.project, JSON.stringify(State.project));
      localStorage.setItem(STORAGE_KEYS.canvas, JSON.stringify(State.canvas));
      localStorage.setItem(STORAGE_KEYS.assets, JSON.stringify(State.assets));
      localStorage.setItem(STORAGE_KEYS.conversation, JSON.stringify(State.conversation));
      localStorage.setItem(STORAGE_KEYS.extraPrompt, State.extraPrompt);
    } catch (e) {
      console.warn('[persist] failed:', e);
    }
  }
  function loadState() {
    try {
      const s = localStorage.getItem(STORAGE_KEYS.settings);
      if (s) State.settings = Object.assign(State.settings, JSON.parse(s));
      const p = localStorage.getItem(STORAGE_KEYS.project);
      if (p) State.project = JSON.parse(p);
      const c = localStorage.getItem(STORAGE_KEYS.canvas);
      if (c) State.canvas = JSON.parse(c);
      const a = localStorage.getItem(STORAGE_KEYS.assets);
      if (a) State.assets = JSON.parse(a);
      const conv = localStorage.getItem(STORAGE_KEYS.conversation);
      if (conv) State.conversation = JSON.parse(conv);
      const ep = localStorage.getItem(STORAGE_KEYS.extraPrompt);
      if (ep) State.extraPrompt = ep;
    } catch (e) { console.warn('[persist] load failed:', e); }
  }

  // ── i18n helper ──────────────────────────────────────────────
  function t(key) {
    return (I18N[State.settings.language] && I18N[State.settings.language][key]) ||
           I18N.en[key] || key;
  }
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
    });
    document.documentElement.lang = State.settings.language;
    document.documentElement.dir = State.settings.language === 'fa' ? 'rtl' : 'ltr';
  }

  // ── Theme ────────────────────────────────────────────────────
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', State.settings.theme);
  }

  // ── Utility: escape HTML ─────────────────────────────────────
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // ── Toast ────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(message, type) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast visible' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 2400);
  }

  // ── Generic modal (promise-based) ────────────────────────────
  function showModal(title, message, buttons) {
    return new Promise(resolve => {
      const overlay = document.getElementById('genericModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      const btnWrap = document.getElementById('modalButtons');
      btnWrap.innerHTML = '';
      buttons.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'st-settings-button' + (b.primary ? ' st-primary' : '') + (b.danger ? ' st-danger' : '');
        btn.textContent = b.label;
        btn.style.minHeight = '36px';
        btn.style.padding = '8px 16px';
        btn.onclick = () => {
          overlay.classList.remove('st-visible');
          resolve(b.value);
        };
        btnWrap.appendChild(btn);
      });
      overlay.classList.add('st-visible');
    });
  }

  /* ============================================================
     CodeHot file parser
     Same brace-walking algorithm as V14's importProjectFile, plus
     mo-marker scanning across all extracted scripts.
     ============================================================ */
  function parseCodeHotHtml(text) {
    const startIdx = text.indexOf('var CONFIG = {');
    if (startIdx === -1) return null;
    const openIdx = text.indexOf('{', startIdx);
    let depth = 0, endIdx = -1, inString = false, escape = false;
    for (let i = openIdx; i < text.length; i++) {
      const ch = text[i];
      if (escape) { escape = false; continue; }
      if (ch === '\\') { escape = true; continue; }
      if (ch === '"') { inString = !inString; continue; }
      if (inString) continue;
      if (ch === '{') depth++;
      else if (ch === '}') { depth--; if (depth === 0) { endIdx = i; break; } }
    }
    if (endIdx === -1) return null;
    let cfg;
    try { cfg = JSON.parse(text.slice(openIdx, endIdx + 1)); }
    catch (e) { return null; }

    const objects = (cfg.objects || []).map(o => ({
      id: o.id, name: o.name, type: o.type
    }));

    // scripts is { objectId: codeString } OR an array. Handle both.
    const scripts = {};
    let scriptCollection = cfg.scripts;
    if (Array.isArray(scriptCollection)) {
      scriptCollection.forEach(s => {
        if (s && (s.objectId || s.object)) {
          scripts[s.objectId || s.object] = s.code || s.source || '';
        }
      });
    } else if (scriptCollection && typeof scriptCollection === 'object') {
      Object.keys(scriptCollection).forEach(k => {
        const v = scriptCollection[k];
        scripts[k] = typeof v === 'string' ? v : (v && (v.code || v.source)) || '';
      });
    }

    // mo-marker scan across all scripts.
    const moSet = new Set();
    const moRegex = /mo\.([a-zA-Z_][a-zA-Z0-9_]*)/g;
    Object.keys(scripts).forEach(k => {
      const code = scripts[k];
      if (!code) return;
      let m;
      while ((m = moRegex.exec(code)) !== null) {
        moSet.add(m[1]);
      }
    });
    const moMarkers = Array.from(moSet);

    return { raw: text, config: cfg, objects, scripts, moMarkers };
  }

  // ── Project upload handler ───────────────────────────────────
  function handleProjectUpload(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = typeof e.target.result === 'string'
        ? e.target.result
        : new TextDecoder().decode(e.target.result);
      const parsed = parseCodeHotHtml(text);
      if (!parsed) {
        showToast(t('uploadInvalid'), 'error');
        return;
      }
      State.project = parsed;
      // Auto-detect existing buttons from mo markers: anything that
      // isn't x/y/axis qualifies as a "button" candidate.
      saveState();
      refreshPlusMenuButtons();
      refreshMoMarkerOptions();
      refreshPhoneScreen();
      showToast(t('uploadSuccess'), 'success');
      // System notice in chat
      addSystemMessage(
        `${t('uploadSuccess')} — ${parsed.objects.length} ${t('objects')}, ` +
        `${Object.keys(parsed.scripts).length} ${t('scripts')}, ` +
        `${parsed.moMarkers.length} ${t('moMarkers')}.`,
        'success'
      );
    };
    reader.onerror = () => showToast(t('uploadInvalid'), 'error');
    reader.readAsArrayBuffer(file);
  }

  // ── Phone screen rendering ───────────────────────────────────
  function refreshPhoneScreen() {
    const screen = document.getElementById('phoneScreen');
    const empty = document.getElementById('phoneEmpty');
    // Remove existing iframe + ui-elements (keep empty state node)
    Array.from(screen.children).forEach(c => {
      if (c !== empty) c.remove();
    });
    if (State.project && State.project.raw) {
      empty.style.display = 'none';
      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-scripts';
      iframe.srcdoc = State.project.raw;
      screen.appendChild(iframe);
    } else {
      empty.style.display = '';
    }
    // Render UI elements from State.canvas
    State.canvas.forEach(el => renderCanvasElement(el));
  }

  /* ============================================================
     Canvas element model & rendering
     Each element: { id, type, name, x, y, w, h, color, text, mo, assetName }
     ============================================================ */
  function genId() { return 'el_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }

  function createElement(type, opts) {
    opts = opts || {};
    const el = {
      id: genId(),
      type: type,
      name: opts.name || defaultName(type),
      x: opts.x != null ? opts.x : 30,
      y: opts.y != null ? opts.y : 30,
      w: opts.w != null ? opts.w : defaultSize(type).w,
      h: opts.h != null ? opts.h : defaultSize(type).h,
      color: opts.color || defaultColor(type),
      text: opts.text || '',
      mo: opts.mo || '',
      assetName: opts.assetName || ''
    };
    State.canvas.push(el);
    saveState();
    renderCanvasElement(el);
    selectElement(el.id);
    return el;
  }

  function defaultName(type) {
    const map = { joystick: 'joystick', button: 'btn', image: 'img', text: 'label' };
    const base = map[type] || 'el';
    let i = 1;
    while (State.canvas.some(e => e.name === base + '_' + i)) i++;
    return base + '_' + i;
  }
  function defaultSize(type) {
    if (type === 'joystick') return { w: 100, h: 100 };
    if (type === 'button') return { w: 64, h: 64 };
    if (type === 'image') return { w: 80, h: 80 };
    if (type === 'text') return { w: 100, h: 28 };
    return { w: 80, h: 80 };
  }
  function defaultColor(type) {
    if (type === 'joystick' || type === 'button') return '#ff6b35';
    if (type === 'text') return '#e0e0e0';
    return '#161b22';
  }

  function renderCanvasElement(el) {
    const screen = document.getElementById('phoneScreen');
    let node = document.getElementById('el-' + el.id);
    if (!node) {
      node = document.createElement('div');
      node.id = 'el-' + el.id;
      node.className = 'ui-element ' + el.type;
      node.dataset.elId = el.id;
      screen.appendChild(node);
      attachElementInteraction(node);
    }
    node.style.left = el.x + 'px';
    node.style.top = el.y + 'px';
    node.style.width = el.w + 'px';
    node.style.height = el.h + 'px';
    if (el.type === 'button') {
      node.style.background = hexToRgba(el.color, 0.5);
      node.style.borderColor = el.color;
      node.textContent = el.text || el.name;
    } else if (el.type === 'joystick') {
      node.style.background = hexToRgba(el.color, 0.25);
      node.style.borderColor = el.color;
      node.textContent = '';
    } else if (el.type === 'image') {
      node.textContent = '';
      const asset = State.assets.find(a => a.name === el.assetName);
      if (asset) {
        node.style.backgroundImage = 'url(' + asset.dataUrl + ')';
        node.style.backgroundSize = 'cover';
        node.style.backgroundPosition = 'center';
      } else {
        node.style.backgroundImage = '';
      }
    } else if (el.type === 'text') {
      node.style.color = el.color;
      node.textContent = el.text || el.name;
    }
    // name tag + handle
    let tag = node.querySelector('.ui-name-tag');
    if (!tag) {
      tag = document.createElement('div');
      tag.className = 'ui-name-tag';
      node.appendChild(tag);
    }
    tag.textContent = el.name + (el.mo ? ' → mo.' + el.mo : '');
    let handle = node.querySelector('.ui-handle');
    if (!handle) {
      handle = document.createElement('div');
      handle.className = 'ui-handle';
      node.appendChild(handle);
    }
    // selection
    node.classList.toggle('selected', el.id === State.selectedElementId);
  }

  function hexToRgba(hex, a) {
    if (!hex || hex[0] !== '#') return hex;
    let h = hex.slice(1);
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // Drag + resize for canvas elements
  function attachElementInteraction(node) {
    let dragMode = null; // 'move' | 'resize'
    let startX, startY, origX, origY, origW, origH;
    const elId = node.dataset.elId;

    function pointerDown(e, mode) {
      e.preventDefault();
      e.stopPropagation();
      dragMode = mode;
      selectElement(elId);
      const pt = getPoint(e);
      startX = pt.x; startY = pt.y;
      const el = State.canvas.find(x => x.id === elId);
      if (!el) return;
      origX = el.x; origY = el.y; origW = el.w; origH = el.h;
      window.addEventListener('mousemove', pointerMove);
      window.addEventListener('mouseup', pointerUp);
      window.addEventListener('touchmove', pointerMove, { passive: false });
      window.addEventListener('touchend', pointerUp);
    }
    function pointerMove(e) {
      if (!dragMode) return;
      e.preventDefault();
      const pt = getPoint(e);
      const dx = pt.x - startX, dy = pt.y - startY;
      const el = State.canvas.find(x => x.id === elId);
      if (!el) return;
      if (dragMode === 'move') {
        el.x = Math.max(0, Math.round(origX + dx));
        el.y = Math.max(0, Math.round(origY + dy));
      } else {
        el.w = Math.max(20, Math.round(origW + dx));
        el.h = Math.max(20, Math.round(origH + dy));
      }
      renderCanvasElement(el);
      if (el.id === State.selectedElementId) syncPropertiesPanel(el);
    }
    function pointerUp() {
      if (dragMode) saveState();
      dragMode = null;
      window.removeEventListener('mousemove', pointerMove);
      window.removeEventListener('mouseup', pointerUp);
      window.removeEventListener('touchmove', pointerMove);
      window.removeEventListener('touchend', pointerUp);
    }
    function getPoint(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    node.addEventListener('mousedown', (e) => pointerDown(e, 'move'));
    node.addEventListener('touchstart', (e) => pointerDown(e, 'move'), { passive: false });
    const handle = node.querySelector('.ui-handle');
    if (handle) {
      handle.addEventListener('mousedown', (e) => pointerDown(e, 'resize'));
      handle.addEventListener('touchstart', (e) => pointerDown(e, 'resize'), { passive: false });
    }
  }

  function selectElement(id) {
    State.selectedElementId = id;
    State.canvas.forEach(el => {
      const n = document.getElementById('el-' + el.id);
      if (n) n.classList.toggle('selected', el.id === id);

    renderPropertiesPanel();
  }

  function deleteElement(id) {
    State.canvas = State.canvas.filter(e => e.id !== id);
    const n = document.getElementById('el-' + id);
    if (n) n.remove();
    if (State.selectedElementId === id) State.selectedElementId = null;
    saveState();
    renderPropertiesPanel();

      // dropdown value was never saved to State.canvas, so the exported

  function renderChatMessage(role, content) {
    const wrap = document.getElementById('chatMessages');
    const empty = document.getElementById('chatEmpty');
    if (empty) empty.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'chat-bubble ' + role;

    if (role === 'assistant') {
      // Split content into prose + code blocks. Code blocks render as cards.
      const parts = splitCodeBlocks(content);
      parts.forEach(p => {
        if (p.type === 'code') {
          div.appendChild(renderCodeCard(p.code, p.lang));
        } else {
          const prose = document.createElement('div');
          prose.textContent = p.text;
          div.appendChild(prose);
        }
      });
    } else {
      div.textContent = content;
    }
    const typing = document.getElementById('typingIndicator');
    wrap.insertBefore(div, typing);
    scrollChatToBottom();
  }

  function splitCodeBlocks(text) {
    // Splits on ```lang\n...``` fences. Anything outside becomes prose.
    const parts = [];
    const re = /```([a-zA-Z]*)\n?([\s\S]*?)```/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) {
        const txt = text.slice(last, m.index).trim();
        if (txt) parts.push({ type: 'text', text: txt });
      }
      parts.push({ type: 'code', lang: m[1] || 'html', code: m[2].replace(/\n$/, '') });
      last = re.lastIndex;
    }
    if (last < text.length) {
      const txt = text.slice(last).trim();
      if (txt) parts.push({ type: 'text', text: txt });
    }
    if (parts.length === 0) parts.push({ type: 'text', text: text });
    return parts;
  }

  function renderCodeCard(code, lang) {
    const card = document.createElement('div');
    card.className = 'code-card';
    card.innerHTML = `
      <div class="code-card-header">
        <div class="code-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>${escapeHtml(lang || 'html')}</span>
        </div>
        <div class="code-card-actions">
          <button class="code-card-btn" data-act="copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>${t('copyCode')}</span>
          </button>
          <button class="code-card-btn primary" data-act="apply">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span>${t('applyToCanvas')}</span>
          </button>
        </div>
      </div>
      <pre class="collapsed">${escapeHtml(code)}</pre>
    `;
    // Wire up buttons
    const pre = card.querySelector('pre');
    card.querySelector('[data-act="copy"]').onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(code).then(() => {
        showToast(t('codeCopied'), 'success');
      });
    };
    card.querySelector('[data-act="apply"]').onclick = (e) => {
      e.stopPropagation();
      applyCodeToCanvas(code);
      showToast(t('codeApplied'), 'success');
    };
    // Toggle code visibility on header click
    card.querySelector('.code-card-header').addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      pre.classList.toggle('collapsed');
    });
    return card;
  }

  // Apply AI-generated UI code to the design canvas by parsing
  // <div class="ui-element" ...> style hints. Best-effort.
  function applyCodeToCanvas(htmlCode) {
    try {
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div>' + htmlCode + '</div>', 'text/html');
      const nodes = doc.querySelectorAll('.ui-element, [data-ui]');
      if (nodes.length === 0) {
        // Fallback: just stash it as a custom HTML element on canvas.
        showToast('No .ui-element found', 'error');
        return;
      }
      nodes.forEach(n => {
        const type = n.dataset.type || (n.classList.contains('joystick') ? 'joystick'
                  : n.classList.contains('button') ? 'button'
                  : n.classList.contains('image') ? 'image'
                  : 'text');
        const x = parseInt(n.style.left) || 30;
        const y = parseInt(n.style.top) || 30;
        const w = parseInt(n.style.width) || defaultSize(type).w;
        const h = parseInt(n.style.height) || defaultSize(type).h;
        createElement(type, {
          name: n.dataset.name || defaultName(type),
          x, y, w, h,
          color: n.style.borderColor || defaultColor(type),
          text: n.textContent.trim(),
          mo: n.dataset.mo || ''
        });
      });
    } catch (e) {
      console.error('[applyCode]', e);
      showToast('Apply failed: ' + e.message, 'error');
    }
  }
