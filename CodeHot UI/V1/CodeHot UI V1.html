  /* ============================================================
     AI integration
     Same worker, same { messages: [...] } contract as CodeHot V14.
     ============================================================ */
  function buildSystemPrompt() {
    const lang = State.settings.language === 'fa' ? 'Persian' : 'English';
    const proj = State.project;
    const objects = proj ? proj.objects : [];
    const scripts = proj ? proj.scripts : {};
    const moMarkers = proj ? proj.moMarkers : [];
    const assets = State.assets;
    const extraPrompt = State.extraPrompt;

    return `You are CodeHot UI Designer — an AI specialized in building mobile game UI overlays for the CodeHot game engine. You design overlays (joysticks, buttons, images, text) that sit on top of an existing CodeHot game and connect to its scripts via "mo" markers.

=== LIVE PROJECT STATE ===
objects: ${JSON.stringify(objects, null, 2)}
scripts: ${JSON.stringify(scripts, null, 2).slice(0, 8000)}
mo markers detected: ${JSON.stringify(moMarkers)}
uploaded image assets: ${JSON.stringify(assets.map(a => ({ name: a.name })))}
${extraPrompt ? 'extra user instruction: ' + extraPrompt : ''}

=== OUTPUT RULES ===
1. Always respond in ${lang}.
2. When the user asks for a UI element, output a complete HTML+CSS+JS snippet inside a single \`\`\`html fence.
3. The snippet must contain one or more <div class="ui-element" data-type="..." data-name="..." data-mo="..." style="position:absolute; left:Xpx; top:Ypx; width:Wpx; height:Hpx; ..."> elements. Use data-type="joystick|button|image|text".
4. For buttons: connect to mo markers actually detected in the user's scripts. Examples: data-mo="jump", data-mo="action", data-mo="joystick.x". Never invent a mo marker that is not in the detected list above unless the user explicitly asks.
5. For joysticks: bind to mo.joystick.x and mo.joystick.y.
6. For images: reference uploaded asset names via data-asset="<name>".
7. Include a small <script> tag at the end that wires touch/mouse events on each UI element to the mo.* surface (assume window.mo exists with boolean / number properties).
8. Also include a 1-2 sentence Persian prose explanation before the code block.
9. Never use emojis. Use SVG icons only.

=== TBJS contract ===
The final exported overlay loads alongside <script src=\"tbjs.js\"><\/script>. TBJS exposes window.mo with: mo.joystick = { x:0, y:0 }, mo.<buttonName> = false (true while pressed). Your script should write to these properties in response to touchstart/touchmove/touchend on the UI elements.`;
  }

  function buildCombinedPrompt(systemPrompt, history, newUserMessage) {
    const historyText = history.length > 0
      ? '\n\n=== CONVERSATION SO FAR ===\n' + history.map(m =>
          (m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content
        ).join('\n\n')
      : '';
    return `${systemPrompt}${historyText}\n\n=== NEW USER MESSAGE ===\nUser: ${newUserMessage}\n\nRespond as the assistant, in character, following all instructions above.`;
  }

  async function sendToAI(userMessage) {
    if (State.isSending) return;
    if (!navigator.onLine) {
      addSystemMessage('Offline — message queued.', 'error');
      return;
    }
    State.isSending = true;
    setSending(true);
    showTyping();

    const systemPrompt = buildSystemPrompt();
    const priorHistory = State.conversation.slice(0, -1).slice(-10);
    const combinedPrompt = buildCombinedPrompt(systemPrompt, priorHistory, userMessage);
    const requestBody = { messages: [{ role: 'user', content: combinedPrompt }] };

    let res = null, rawText = '', lastErr = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        rawText = await res.text();
        break;
      } catch (e) {
        lastErr = e;
        if (attempt < 2) await new Promise(r => setTimeout(r, 450 * (attempt + 1)));
      }
    }
    if (!res) {
      hideTyping();
      State.isSending = false;
      setSending(false);
      addSystemMessage('Network error: ' + (lastErr ? lastErr.message : 'unknown'), 'error');
      return;
    }
    if (!res.ok) {
      hideTyping();
      State.isSending = false;
      setSending(false);
      addSystemMessage('HTTP ' + res.status + ': ' + rawText.slice(0, 160), 'error');
      return;
    }

    let data;
    try { data = JSON.parse(rawText); }
    catch (e) {
      hideTyping();
      State.isSending = false;
      setSending(false);
      addSystemMessage('Bad JSON: ' + rawText.slice(0, 160), 'error');
      return;
    }
    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
      hideTyping();
      State.isSending = false;
      setSending(false);
      addSystemMessage('Unexpected response shape', 'error');
      return;
    }
    const content = data.choices[0].message.content || '';
    hideTyping();
    State.isSending = false;
    setSending(false);
    addAssistantMessage(content);
  }

  function setSending(v) {
    const btn = document.getElementById('btnSend');
    const ta = document.getElementById('chatTextarea');
    btn.disabled = v || !ta.value.trim();
    ta.disabled = v;
  }

  function updateSendButton() {
    const ta = document.getElementById('chatTextarea');
    const btn = document.getElementById('btnSend');
    btn.disabled = State.isSending || !ta.value.trim();
  }

  function autoGrowTextarea(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
  }

  /* ============================================================
     Export — final runnable HTML
     ============================================================ */
  function buildExportHtml() {
    const proj = State.project;

    // V1.1 fix: build UI elements with proper data-tbjs-* attributes so the
    // inlined TBJS auto-discovers them. Also use el.w/el.h (the actual canvas
    // state field names) instead of el.width/el.height which never existed.
    const elementsHtml = State.canvas.map(el => {
      const style = `position:absolute;left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;` +
        (el.type === 'joystick' ? `border-radius:50%;background:${hexToRgba(el.color, 0.25)};border:2px solid ${el.color};`
       : el.type === 'button' ? `border-radius:50%;background:${hexToRgba(el.color, 0.5)};border:2px solid ${el.color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;`
       : el.type === 'image' ? `border:2px solid #2a2a2a;background:#161b22;background-size:cover;background-position:center;`
       : `color:${el.color};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;`);
      const assetAttr = el.assetName ? `data-asset="${escapeHtml(el.assetName)}"` : '';
      // V1.1: the mo connection field is el.mo. Add both data-mo (legacy) and
      // data-tbjs-type + data-tbjs-name so TBJS.autoDiscover() picks it up.
      const tbjsType = el.type === 'joystick' ? 'joystick' : el.type === 'button' ? 'button' : '';
      const tbjsName = el.mo || el.name;
      const tbjsAttrs = tbjsType ? `data-tbjs-type="${tbjsType}" data-tbjs-name="${escapeHtml(tbjsName)}"` : '';
      const moAttr = el.mo ? `data-mo="${escapeHtml(el.mo)}"` : '';
      const inner = el.type === 'image' ? '' : escapeHtml(el.text || el.name);
      return `    <div class="ui-element ui-${el.type}" data-type="${el.type}" data-name="${escapeHtml(el.name)}" ${moAttr} ${tbjsAttrs} ${assetAttr} style="${style}">${inner}</div>`;
    }).join('\n');

    const assetData = State.assets.map(a => `    "${a.name}": "${a.dataUrl}"`).join(',\n');

    // V1.1 critical fix: the old export put the game inside an <iframe>, which
    // meant window.mo in the parent (where the UI lives) was NOT the same
    // object as window.mo inside the iframe (where the game script runs). The
    // game's mo reads were always undefined, so button presses had no effect.
    //
    // The new export inlines the game directly into the page so UI and game
    // share the same window.mo. We extract the game's CONFIG JSON, Three.js
    // source, and player script from the uploaded HTML and re-emit them here.
    let gameThreeSource = '';
    let gameConfigJson = '{}';
    let gamePlayerScript = '';
    if (proj && proj.raw) {
      // Extract Three.js source from the game's first <script> block
      const threeMatch = proj.raw.match(/<script>([\s\S]*?)<\/script>/);
      if (threeMatch && threeMatch[1].length > 50000) gameThreeSource = threeMatch[1];
      // Extract CONFIG JSON using brace-walking
      const cfgStart = proj.raw.indexOf('var CONFIG = {');
      if (cfgStart !== -1) {
        const openIdx = proj.raw.indexOf('{', cfgStart);
        let depth = 0, endIdx = -1, inStr = false, esc = false;
        for (let i = openIdx; i < proj.raw.length; i++) {
          const ch = proj.raw[i];
          if (esc) { esc = false; continue; }
          if (ch === '\\') { esc = true; continue; }
          if (ch === '"') { inStr = !inStr; continue; }
          if (inStr) continue;
          if (ch === '{') depth++;
          else if (ch === '}') { depth--; if (depth === 0) { endIdx = i; break; } }
        }
        if (endIdx !== -1) gameConfigJson = proj.raw.slice(openIdx, endIdx + 1);
      }
      // Extract player script (the IIFE after the CONFIG)
      const playerMatch = proj.raw.match(/<script>\s*(\(function \(\) \{[\s\S]*?\}\)\(\);)\s*<\/script>/);
      if (playerMatch) gamePlayerScript = playerMatch[1];
    }

    // Read tbjs.js content if available (inline it so the export is standalone)
    let tbjsInline = '';
    try {
      // If we have the tbjs.js content in State, use it; otherwise use a minimal fallback
      tbjsInline = (typeof TBJS_SOURCE !== 'undefined' && TBJS_SOURCE) ? TBJS_SOURCE : '';
    } catch (e) {}
    if (!tbjsInline) {
      // Minimal inline TBJS fallback — same as before but with data-tbjs-* support
      tbjsInline = `(function(){var s={};function ep(n){if(!s[n]){if(n==='joystick'||n==='camera')s[n]={x:0,y:0,active:false};else s[n]=false;}}function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function bj(e,n){var r=e.getBoundingClientRect(),rad=Math.min(r.width,r.height)/2,pid=null,cx=r.left+r.width/2,cy=r.top+r.height/2;
function od(ev){ev.preventDefault();pid=ev.pointerId!=null?ev.pointerId:'m';if(ev.setPointerCapture&&ev.pointerId!=null)try{e.setPointerCapture(ev.pointerId)}catch(x){}om(ev);}
function om(ev){if(pid===null)return;if(ev.pointerId!=null&&ev.pointerId!==pid)return;var x=(ev.clientX-cx)/rad,y=(ev.clientY-cy)/rad,m=Math.sqrt(x*x+y*y);if(m>1){x/=m;y/=m;}ep(n);s[n].x=x;s[n].y=y;s[n].active=true;}
function ou(){pid=null;ep(n);s[n].x=0;s[n].y=0;s[n].active=false;}
e.addEventListener('pointerdown',od);e.addEventListener('pointermove',om);e.addEventListener('pointerup',ou);e.addEventListener('pointercancel',ou);e.addEventListener('pointerleave',ou);}
function bb(e,n){ep(n);function od(ev){ev.preventDefault();s[n]=true;e.classList.add('tbjs-active');}function ou(){s[n]=false;e.classList.remove('tbjs-active');}
e.addEventListener('pointerdown',od);e.addEventListener('pointerup',ou);e.addEventListener('pointercancel',ou);e.addEventListener('pointerleave',ou);}
function ad(){document.querySelectorAll('[data-tbjs-type]').forEach(function(e){var t=e.getAttribute('data-tbjs-type'),n=e.getAttribute('data-tbjs-name')||'action';ep(n);if(t==='joystick')bj(e,n);else bb(e,n);});}
window.mo=s;window.TBJS={version:'1.1',autoDiscover:ad,state:s};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ad);else ad();})();`;
    }

    // Build the final HTML — game inlined, not in an iframe
    const gameScript = gameThreeSource ? `
<script>
${gameThreeSource}
<\/script>
<script>
var CONFIG = ${gameConfigJson};
${gamePlayerScript}
<\/script>` : '';

    return `<!DOCTYPE html>
<!-- CodeHot UI V1 exported game. Bundles game + UI overlay + TBJS in one file. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CodeHot Game + UI</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87ceeb; }
  #gameCanvas, #codehot-canvas { display:block; position:absolute; top:0; left:0; width:100%; height:100%; }
  #uiLayer { position:absolute; inset:0; pointer-events:none; z-index:100; }
  #uiLayer .ui-element { pointer-events:auto; -webkit-user-select:none; user-select:none; touch-action:none; }
  #uiLayer .ui-element:active { opacity:0.8; }
</style>
</head>
<body>
<canvas id="codehot-canvas"></canvas>
<div id="uiLayer">
${elementsHtml}
</div>
<script>
/* TBJS — Touch Binding JS. Connects UI elements to the mo object that game
   scripts read. Auto-discovers elements with data-tbjs-type attributes. */
${tbjsInline}
<\/script>
${gameScript}
</body>
</html>`;
  }

  function exportHtml() {
    const html = buildExportHtml();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'codehot-ui-export.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showToast(t('exportReady'), 'success');
  }

  /* ============================================================
     Settings sheet
     ============================================================ */
  function renderSettingsSheet() {
    const body = document.getElementById('settingsBody');
    body.innerHTML = `
      <div class="st-settings-section">
        <div class="st-section-header">
          <span>${t('appearance')}</span>
          <span class="st-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="st-section-body">
          <div class="st-setting-row">
            <span class="st-setting-label">${t('theme')}</span>
            <div class="st-segmented" id="themeSeg">
              <button data-val="dark" class="${State.settings.theme==='dark'?'st-active':''}">${t('dark')}</button>
              <button data-val="light" class="${State.settings.theme==='light'?'st-active':''}">${t('light')}</button>
            </div>
          </div>
          <div class="st-setting-row">
            <span class="st-setting-label">${t('language')}</span>
            <div class="st-segmented" id="langSeg">
              <button data-val="fa" class="${State.settings.language==='fa'?'st-active':''}">فا</button>
              <button data-val="en" class="${State.settings.language==='en'?'st-active':''}">EN</button>
            </div>
          </div>
        </div>
      </div>

      <div class="st-settings-section">
        <div class="st-section-header">
          <span>${t('dataManagement')}</span>
          <span class="st-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="st-section-body">
          <button class="st-settings-button" id="btnClearConv">${t('clearConversation')}</button>
          <button class="st-settings-button st-danger" id="btnClearAll">${t('clearAll')}</button>
        </div>
      </div>

      <div class="st-settings-section">
        <div class="st-section-header st-collapsed">
          <span>${t('moMarkers')}</span>
          <span class="st-section-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="st-section-body st-collapsed">
          <div class="st-preview-box">
            ${State.project && State.project.moMarkers && State.project.moMarkers.length
              ? State.project.moMarkers.map(m => '<div class="asset-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span class="chip-name">mo.' + escapeHtml(m) + '</span></div>').join('')
              : '<div class="st-setting-hint">' + t('noButtonDetected') + '</div>'}
          </div>
        </div>
      </div>
    `;

    // Section collapse toggles
    body.querySelectorAll('.st-section-header').forEach(h => {
      h.addEventListener('click', () => {
        h.classList.toggle('st-collapsed');
        const b = h.nextElementSibling;
        if (b) b.classList.toggle('st-collapsed');
      });
    });
    // Theme buttons
    body.querySelectorAll('#themeSeg button').forEach(b => {
      b.addEventListener('click', () => {
        State.settings.theme = b.dataset.val;
        applyTheme();
        saveState();
        renderSettingsSheet();
      });
    });
    // Language buttons
    body.querySelectorAll('#langSeg button').forEach(b => {
      b.addEventListener('click', () => {
        State.settings.language = b.dataset.val;
        applyI18n();
        saveState();
        renderSettingsSheet();
        refreshPlusMenuButtons();
        renderPropertiesPanel();
      });
    });
    // Clear conversation
    body.querySelector('#btnClearConv').onclick = async () => {
      const ok = await showModal(t('confirmClear'), t('clearConversation'), [
        { label: t('cancel'), value: false },
        { label: t('confirm'), value: true, danger: true }
      ]);
      if (!ok) return;
      State.conversation = [];
      document.querySelectorAll('.chat-bubble').forEach(n => n.remove());
      const empty = document.getElementById('chatEmpty');
      if (empty) empty.style.display = '';
      saveState();
    };
    // Clear all
    body.querySelector('#btnClearAll').onclick = async () => {
      const ok = await showModal(t('confirmClear'), t('clearAll'), [
        { label: t('cancel'), value: false },
        { label: t('confirm'), value: true, danger: true }
      ]);
      if (!ok) return;
      Object.keys(STORAGE_KEYS).forEach(k => { try { localStorage.removeItem(STORAGE_KEYS[k]); } catch (e) {} });
      location.reload();
    };
  }

  /* ============================================================
     Tab switching
     ============================================================ */
  function switchTab(name) {
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.tab === name);
    });
    document.querySelectorAll('.sh-tab-btn').forEach(b => {
      b.classList.toggle('sh-active', b.dataset.tab === name);
    });
    if (name === 'design') {
      refreshPhoneScreen();
      renderPropertiesPanel();
    }
  }

  /* ============================================================
     Wire up the DOM
     ============================================================ */
  function wire() {
    // Tab bar
    document.querySelectorAll('.sh-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Upload project
    document.getElementById('btnUploadProject').addEventListener('click', () => {
      document.getElementById('fileInputProject').click();
    });
    document.getElementById('fileInputProject').addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) handleProjectUpload(f);
    });

    // Settings
    document.getElementById('btnSettings').addEventListener('click', () => {
      renderSettingsSheet();
      document.getElementById('settingsSheet').classList.add('visible');
    });
    document.querySelectorAll('[data-close-settings]').forEach(b => {
      b.addEventListener('click', () => {
        document.getElementById('settingsSheet').classList.remove('visible');
      });
    });

    // Chat textarea
    const ta = document.getElementById('chatTextarea');
    ta.addEventListener('input', () => {
      autoGrowTextarea(ta);
      updateSendButton();
    });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 600px)').matches) {
        e.preventDefault();
        submitChat();
      }
    });
    document.getElementById('btnSend').addEventListener('click', submitChat);

    // + button & menu
    document.getElementById('btnPlus').addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = document.getElementById('plusMenu');
      if (menu.classList.contains('visible')) closePlusMenu();
      else openPlusMenu();
    });
    document.querySelectorAll('#plusMenu [data-action]').forEach(b => {
      b.addEventListener('click', () => {
        const a = b.dataset.action;
        if (a === 'image') handlePlusImage();
        else if (a === 'prompt') openPromptEditor();
      });
    });
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('plusMenu');
      if (menu.classList.contains('visible') &&
          !menu.contains(e.target) &&
          e.target.id !== 'btnPlus' &&
          !e.target.closest('#btnPlus')) {
        closePlusMenu();
      }
    });

    // Extra prompt editor
    document.getElementById('btnClosePrompt').addEventListener('click', () => {
      const ta2 = document.getElementById('extraPromptText');
      State.extraPrompt = ta2.value;
      saveState();
      closePromptEditor();
    });
    document.getElementById('extraPromptText').addEventListener('input', (e) => {
      State.extraPrompt = e.target.value;
      saveState();
    });

    // Image upload from + menu
    document.getElementById('fileInputImage').addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) onImagePicked(f);
    });

    // Design toolbar buttons
    document.getElementById('btnAddJoystick').addEventListener('click', () => createElement('joystick'));
    document.getElementById('btnAddButton').addEventListener('click', () => createElement('button'));
    document.getElementById('btnAddImage').addEventListener('click', () => {
      document.getElementById('fileInputImageElement').click();
    });
    document.getElementById('btnAddText').addEventListener('click', () => createElement('text'));
    document.getElementById('btnClearCanvas').addEventListener('click', async () => {
      if (State.canvas.length === 0) return;
      const ok = await showModal(t('confirmClear'), t('clear'), [
        { label: t('cancel'), value: false },
        { label: t('confirm'), value: true, danger: true }
      ]);
      if (ok) clearCanvas();
    });
    // Image element upload
    document.getElementById('fileInputImageElement').addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const name = (f.name || 'image').replace(/\.[^.]+$/, '');
        State.assets.push({ name, dataUrl });
        saveState();
        createElement('image', { assetName: name });
      };
      reader.readAsDataURL(f);
    });

    // Palette drag & drop (HTML5 DnD)
    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/x-codehot-ui', item.dataset.add);
      });
    });
    const phoneScreen = document.getElementById('phoneScreen');
    phoneScreen.addEventListener('dragover', (e) => { e.preventDefault(); });
    phoneScreen.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/x-codehot-ui');
      if (!type) return;
      const rect = phoneScreen.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      createElement(type, { x: Math.max(0, x - 30), y: Math.max(0, y - 30) });
    });

    // Click empty canvas area to deselect
    phoneScreen.addEventListener('click', (e) => {
      if (e.target === phoneScreen || e.target.id === 'phoneEmpty') {
        selectElement(null);
      }
    });

    // Export
    document.getElementById('btnExport').addEventListener('click', exportHtml);
  }

  function submitChat() {
    const ta = document.getElementById('chatTextarea');
    const msg = ta.value.trim();
    if (!msg || State.isSending) return;
    addUserMessage(msg);
    ta.value = '';
    autoGrowTextarea(ta);
    updateSendButton();
    sendToAI(msg);
  }

  /* ============================================================
     Init
     ============================================================ */
  function init() {
    loadState();
    applyTheme();
    applyI18n();
    wire();
    refreshPlusMenuButtons();
    refreshPhoneScreen();
    renderPropertiesPanel();
    // Restore chat history
    if (State.conversation.length > 0) {
      const empty = document.getElementById('chatEmpty');
      if (empty) empty.style.display = 'none';
      State.conversation.forEach(m => renderChatMessage(m.role, m.content));
    }
    // Restore extra prompt editor visibility
    if (State.extraPrompt) {
      document.getElementById('extraPromptText').value = State.extraPrompt;
      document.getElementById('promptEditor').classList.add('visible');
    }
    updateSendButton();
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
